<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>playlister</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <h1>playlister</h1>
  <div id="tabs">
    <button class="tab-button active" data-tab="list">List</button>
    <button class="tab-button" data-tab="dashboards">Dashboards</button>
  </div>
  <div id="list-tab">
    <div id="filters"></div>
    <div id="app">Loading...</div>
  </div>
  <div id="dashboards-tab" style="display: none;">
    <div id="dashboards">
      <div class="dashboard-chart">
        <h2>Songs by Release Year</h2>
        <div id="year-chart" class="chart-container"></div>
      </div>
      <div class="dashboard-chart">
        <h2>Songs by Decade</h2>
        <div id="decade-chart" class="chart-container"></div>
      </div>
      <div class="dashboard-chart">
        <h2>Songs Liked Over Time</h2>
        <div id="liked-chart" class="chart-container"></div>
      </div>
      <div class="dashboard-chart">
        <h2>Songs by Artist Popularity</h2>
        <div id="popularity-chart" class="chart-container"></div>
      </div>
      <div class="dashboard-chart">
        <h2>Songs by Country</h2>
        <div id="world-map-chart" class="chart-container chart-container-map"></div>
      </div>
    </div>
  </div>
  <script src="/rangeSlider.js"></script>
  <script src="/filters.js"></script>
  <script src="/songTable.js"></script>
  <script src="/tabs.js"></script>
  <script src="/countryCoords.js"></script>
  <script src="/app.js"></script>
  <script src="/dashboards.js"></script>
</body>
</html>
